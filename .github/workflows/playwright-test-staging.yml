name: Playwright Tests

on:
  workflow_call:
    inputs:
      test_path:
        description: "Path to test files (e.g., tests/ci/)"
        default: "tests/ci/"
        type: string
      browsers:
        description: "Browsers to install (space-separated: webkit chromium firefox)"
        default: "webkit chromium"
        type: string
      branch:
        description: "Branch name for 1Password URL lookup (use github.event.workflow_run.head_branch for workflow_run triggers)"
        default: ""
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Load secrets from 1Password
        id: op-load-secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          WORKFLOWS_PAT: ${{ vars.WORKFLOWS_OP_REF }}
          STAGING_HOST: "op://${{ vars.CLIENTS_VAULT_ID }}/${{ vars.ITEM_ID }}/domain/${{ inputs.branch || github.ref_name }}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.op-load-secrets.outputs.WORKFLOWS_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure GitHub Packages auth
        run: |
          echo "@coto-studio:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ steps.op-load-secrets.outputs.WORKFLOWS_PAT }}" >> .npmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps ${{ inputs.browsers }}

      - name: Verify staging URL
        run: |
          if [ -z "$STAGING_HOST" ]; then
            echo "::error::STAGING_HOST is empty. Check 1Password field: domain/${{ inputs.branch || github.ref_name }}"
            exit 1
          fi
          echo "Running tests against https://${STAGING_HOST}"
        env:
          STAGING_HOST: ${{ steps.op-load-secrets.outputs.STAGING_HOST }}

      # The deploy job finishes once the stack is updated, not once Ghost is up,
      # so the first tests used to hit the proxy's 404 while the new container
      # was still starting.
      - name: Wait for staging to respond
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://${STAGING_HOST}/" || true)
            [ "$status" = "200" ] && { echo "Staging is up (attempt $i)"; exit 0; }
            echo "Waiting for staging... HTTP $status (attempt $i)"
            sleep 10
          done
          echo "::error::https://${STAGING_HOST}/ did not return 200 within 5 minutes"
          exit 1
        env:
          STAGING_HOST: ${{ steps.op-load-secrets.outputs.STAGING_HOST }}

      - name: Run Playwright tests
        run: bunx playwright test ${{ inputs.test_path }}
        env:
          BASE_URL: "https://${{ steps.op-load-secrets.outputs.STAGING_HOST }}"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
