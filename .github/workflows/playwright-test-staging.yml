name: Playwright Tests

on:
  workflow_call:
    inputs:
      test_path:
        description: 'Path to test files (e.g., tests/ci/)'
        default: 'tests/ci/'
        type: string
      node_version:
        description: 'Node.js version'
        default: '20'
        type: string
      browsers:
        description: 'Browsers to install (space-separated: webkit chromium firefox)'
        default: 'webkit chromium'
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ inputs.browsers }}

      - name: Load staging URL from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          STAGING_URL: "op://${{ vars.CLIENTS_VAULT_ID }}/${{ vars.ITEM_ID }}/staging/url"

      - name: Run Playwright tests
        run: npx playwright test ${{ inputs.test_path }}
        env:
          BASE_URL: ${{ env.STAGING_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
