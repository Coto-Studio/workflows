name: Playwright Tests

on:
  workflow_call:
    inputs:
      test_path:
        description: "Path to test files (e.g., tests/ci/)"
        default: "tests/ci/"
        type: string
      browsers:
        description: "Browsers to install (space-separated: webkit chromium firefox)"
        default: "webkit chromium"
        type: string
      branch:
        description: "Branch name for 1Password URL lookup (use github.event.workflow_run.head_branch for workflow_run triggers)"
        default: ""
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Load secrets from 1Password
        id: op-load-secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          WORKFLOWS_PAT: ${{ vars.WORKFLOWS_OP_REF }}
          STAGING_URL: "op://${{ vars.CLIENTS_VAULT_ID }}/${{ vars.ITEM_ID }}/domain/${{ inputs.branch || github.ref_name }}/url"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.op-load-secrets.outputs.WORKFLOWS_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure GitHub Packages auth
        run: |
          echo "@coto-studio:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ steps.op-load-secrets.outputs.WORKFLOWS_PAT }}" >> .npmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps ${{ inputs.browsers }}

      - name: Run Playwright tests
        run: bunx playwright test ${{ inputs.test_path }}
        env:
          BASE_URL: ${{ steps.op-load-secrets.outputs.STAGING_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
