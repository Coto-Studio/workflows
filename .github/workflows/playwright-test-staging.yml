name: Playwright Tests

on:
  workflow_call:
    inputs:
      test_path:
        description: "Path to test files (e.g., tests/ci/)"
        default: "tests/ci/"
        type: string
      node_version:
        description: "Node.js version"
        default: "20"
        type: string
      browsers:
        description: "Browsers to install (space-separated: webkit chromium firefox)"
        default: "webkit chromium"
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Load secrets from 1Password
        id: op-load-secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          WORKFLOWS_PAT: ${{ vars.WORKFLOWS_OP_REF }}
          STAGING_URL: "op://${{ vars.CLIENTS_VAULT_ID }}/${{ vars.ITEM_ID }}/domain/${{ github.ref_name }}/url"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.op-load-secrets.outputs.WORKFLOWS_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ steps.op-load-secrets.outputs.WORKFLOWS_PAT }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ inputs.browsers }}

      - name: Run Playwright tests
        run: npx playwright test ${{ inputs.test_path }}
        env:
          BASE_URL: ${{ steps.op-load-secrets.outputs.STAGING_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
