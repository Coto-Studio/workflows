name: Docker

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (production, staging)'
        default: 'production'
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

permissions:
  packages: write

jobs:
  build-and-push-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Set bake target
        id: config
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            echo "bake_target=dev" >> $GITHUB_OUTPUT
          fi

      - name: OP Load secrets
        id: op-load-secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          WORKFLOWS_PAT: ${{ vars.WORKFLOWS_OP_REF }}

      - uses: actions/checkout@v7
        with:
          lfs: true
          token: ${{ steps.op-load-secrets.outputs.WORKFLOWS_PAT }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ steps.op-load-secrets.outputs.WORKFLOWS_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        run: docker buildx bake ${{ steps.config.outputs.bake_target }}
        env:
          GITHUB_TOKEN: ${{ steps.op-load-secrets.outputs.WORKFLOWS_PAT }}
